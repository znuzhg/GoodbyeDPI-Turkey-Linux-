name: Windows x64 build

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64 backend (MinGW-w64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            make unzip zip ca-certificates

      - name: Download pinned WinDivert SDK/runtime
        working-directory: windows
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip \
            --output WinDivert-2.2.2-A.zip
          echo "63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15  WinDivert-2.2.2-A.zip" | sha256sum --check
          mkdir -p deps
          unzip -q WinDivert-2.2.2-A.zip -d deps

      - name: Compile Windows x64 executable
        run: |
          set -euo pipefail
          make -C windows/src clean
          make -C windows/src \
            CPREFIX=x86_64-w64-mingw32- \
            BIT64=1 \
            WINDIVERT_DIR=../deps/WinDivert-2.2.2-A
          test -s windows/src/goodbyedpi.exe
          x86_64-w64-mingw32-objdump -f windows/src/goodbyedpi.exe

      - name: Package executable and runtime
        run: |
          set -euo pipefail
          PACKAGE=dist/GoodbyeDPI-Turkey-Windows-x64
          mkdir -p "$PACKAGE/bin"
          cp windows/src/goodbyedpi.exe "$PACKAGE/bin/"
          find windows/deps/WinDivert-2.2.2-A/x64 -maxdepth 1 -type f \
            \( -iname '*.dll' -o -iname '*.sys' \) \
            -exec cp {} "$PACKAGE/bin/" \;
          test -s "$PACKAGE/bin/goodbyedpi.exe"
          test -n "$(find "$PACKAGE/bin" -maxdepth 1 -iname '*.dll' -print -quit)"
          test -n "$(find "$PACKAGE/bin" -maxdepth 1 -iname '*.sys' -print -quit)"
          cp windows/run.cmd windows/install_service.cmd windows/remove_service.cmd \
             windows/README.md windows/LICENSE-APACHE-2.0.txt \
             windows/WINDIVERT-LICENSE.txt windows/THIRD-PARTY-NOTICES.md \
             dist/GoodbyeDPI-Turkey-Windows-x64/
          test -s "$PACKAGE/WINDIVERT-LICENSE.txt"
          test -s "$PACKAGE/THIRD-PARTY-NOTICES.md"
          cd dist
          zip -qr GoodbyeDPI-Turkey-Windows-x64.zip GoodbyeDPI-Turkey-Windows-x64

      - name: Upload Windows x64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-Turkey-Windows-x64
          path: dist/GoodbyeDPI-Turkey-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  powershell-native-build:
    name: Native build with Windows PowerShell 5.1 and PowerShell 7
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build with Windows PowerShell 5.1
        shell: powershell
        run: .\windows\build.ps1

      - name: Verify Windows PowerShell 5.1 output
        shell: powershell
        run: |
          if (-not (Test-Path .\windows\bin\goodbyedpi.exe)) {
            throw 'Windows PowerShell 5.1 build did not produce goodbyedpi.exe.'
          }

      - name: Build with PowerShell 7
        shell: pwsh
        run: .\windows\build.ps1

      - name: Verify PowerShell 7 output
        shell: pwsh
        run: |
          if (-not (Test-Path .\windows\bin\goodbyedpi.exe)) {
            throw 'PowerShell 7 build did not produce goodbyedpi.exe.'
          }

  powershell-clean-bootstrap:
    name: Clean MSYS2 bootstrap with Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build from a clean MSYS2 location
        shell: powershell
        run: |
          $env:MSYS2_ROOT = Join-Path $env:RUNNER_TEMP 'goodbyedpi-msys2-clean'
          if (Test-Path -LiteralPath $env:MSYS2_ROOT) {
            Remove-Item -LiteralPath $env:MSYS2_ROOT -Recurse -Force
          }
          .\windows\build.ps1

      - name: Verify clean bootstrap output and runtime
        shell: powershell
        run: |
          $required = @(
            '.\windows\bin\goodbyedpi.exe',
            '.\windows\bin\WinDivert.dll',
            '.\windows\bin\WinDivert64.sys'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Clean bootstrap did not produce required file: $path"
            }
          }
