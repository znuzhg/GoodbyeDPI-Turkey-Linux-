name: Windows x64 build

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64 backend (MinGW-w64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            make unzip zip ca-certificates

      - name: Download pinned WinDivert SDK/runtime
        working-directory: windows
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://reqrypt.org/download/WinDivert-2.2.0-D.zip \
            --output WinDivert-2.2.0-D.zip
          echo "1d461cfdfa7ba88ebcfbb3603b71b703e9f72aba8aeff99a75ce293e6f89d2ba  WinDivert-2.2.0-D.zip" \
            | sha256sum --check
          mkdir -p deps
          unzip -q WinDivert-2.2.0-D.zip -d deps

      - name: Compile Windows x64 executable
        run: |
          set -euo pipefail
          make -C windows/src clean
          make -C windows/src \
            CPREFIX=x86_64-w64-mingw32- \
            BIT64=1 \
            WINDIVERT_DIR=../deps/WinDivert-2.2.0-D
          test -s windows/src/goodbyedpi.exe
          x86_64-w64-mingw32-objdump -f windows/src/goodbyedpi.exe

      - name: Package executable and runtime
        run: |
          set -euo pipefail
          mkdir -p dist/GoodbyeDPI-Turkey-Windows-x64
          cp windows/src/goodbyedpi.exe dist/GoodbyeDPI-Turkey-Windows-x64/
          find windows/deps/WinDivert-2.2.0-D/x64 -maxdepth 1 -type f \
            \( -iname '*.dll' -o -iname '*.sys' \) \
            -exec cp {} dist/GoodbyeDPI-Turkey-Windows-x64/ \;
          test -n "$(find dist/GoodbyeDPI-Turkey-Windows-x64 -maxdepth 1 -iname '*.dll' -print -quit)"
          test -n "$(find dist/GoodbyeDPI-Turkey-Windows-x64 -maxdepth 1 -iname '*.sys' -print -quit)"
          cp windows/run.cmd windows/install_service.cmd windows/remove_service.cmd \
             windows/README.md dist/GoodbyeDPI-Turkey-Windows-x64/
          cd dist
          zip -qr GoodbyeDPI-Turkey-Windows-x64.zip GoodbyeDPI-Turkey-Windows-x64

      - name: Upload Windows x64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-Turkey-Windows-x64
          path: dist/GoodbyeDPI-Turkey-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
